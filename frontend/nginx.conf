server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> backend Go. Le `resolver` + variable évite que nginx fige l'IP
    # du conteneur backend au démarrage (utile quand il est recréé).
    # On vise le nom de conteneur (container_name du compose) et non l'alias de
    # service « backend » : ce conteneur est aussi sur le réseau « web », où une
    # autre stack peut porter le même alias, et Docker DNS répondrait avec la mauvaise IP.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://creme-backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|svg|png|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
